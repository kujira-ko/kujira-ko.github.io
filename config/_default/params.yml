# ===== reimu 主题配置（鲸子酱专属海洋风） =====

# 主导航
menu:
  - name: home
    url: ""
  - name: archives
    url: "archives"
  - name: about
    url: "about"
  - name: friend
    url: "friend"

# 友链
friends:
  shuffle: false

# 文章放在哪个目录
mainSections: ["posts"]

# 时间格式
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

# 作者信息
author: kujira-ko
email: a13014406930@163.com
description: "一个会写代码的可爱少女的学习日记"

# 打字机副标题
subtitle:
  typing:
    enable: true
    strings:
      - "你好呀，我是kujira-ko，一个会写代码的可爱少女"
      - "这里记录我学习各种小玩意儿的过程"
      - "偶尔把踩过的坑写成攻略，供大家学习"
      - "欢迎大家来我的小窝做客～"
    typeSpeed: 120
    backSpeed: 60
    backDelay: 1500
    startDelay: 300
    loop: true
    shuffle: false
    showCursor: true
    cursorChar: "|"
    smartBackspace: false
  text: "少女祈祷中..."

# 横幅：鲸鱼娘入水图（三尺寸自适应）与头像（本鲸定妆照）
banner: "images/banner.webp"
banner_srcset:
  enable: true
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"
avatar: "avatar.jpg"

# 文章目录
toc: true

excerpt_link: Read More

# 鼠标光标
# 鼠标指针
reimu_cursor:
  enable: false
  cursor:
    default: ../images/cursor/cursor.png
    pointer: ../images/cursor/cursor-pointer.png
    text: ../images/cursor/cursor.png

# 主题配色：红系 → 海洋蓝系
internal_theme:
  light:
    --red-0: '#0b6fa4'
    --red-1: '#1e88b0'
    --red-2: '#3aa6c9'
    --red-3: '#5fbcd9'
    --red-4: '#93d6e8'
    --red-5: '#d6f1f9'
    --red-5-5: '#e9f8fc'
    --red-6: '#f3fbfe'
    --color-red-6-shadow: 'rgba(30, 136, 176, 0.6)'
    --color-red-3-shadow: 'rgba(30, 136, 176, 0.3)'
  dark:
    --red-4: 'rgba(147, 214, 232, 0.5)'
    --red-5: 'rgba(214, 241, 249, 0.15)'
    --red-5-5: 'rgba(233, 248, 252, 0.05)'
    --red-6: 'rgba(243, 251, 254, 0.2)'
# 背景音乐播放器（主题自带 APlayer，进站即见）
player:
  disable_on_mobile: false
  aplayer:
    enable: false
    options:
      audio:
        - name: 小窝
          artist: kujira-ko
          url: /music/xiaowo.mp3
          cover: /images/covers/cover-main.webp
      fixed: true
      volume: 0.6
      preload: none
      mutex: true
  meting:
    enable: false

# 素材署名（封面/站点插图，已获作者授权）
copyright: |-
  <div style="margin-bottom:6px;">封面/站点插图：Xx勿忘xX（Bilibili）· 已获作者授权，仅个人展示</div>

# 侧栏注入：网易云官方外链播放器（主题曲《小窝》）
injector:
  sidebar_begin: |-
    <div class="netease-player" style="margin: 0 0 14px 0;">
      <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width="100%" height="86"
        src="https://music.163.com/outchain/player?type=2&amp;id=3450609412&amp;auto=0&amp;height=66"
        style="border-radius: 10px; overflow: hidden;"></iframe>
    </div>
