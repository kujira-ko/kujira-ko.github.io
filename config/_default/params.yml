# ===== reimu 主题配置（鲸子酱专属海洋风） =====

# 主导航
menu:
  - name: home
    url: ""
  - name: archives
    url: "archives"
  - name: about
    url: "about"
  - name: friend
    url: "friend"

# 友链
friends:
  shuffle: false

# 文章放在哪个目录
mainSections: ["posts"]

# 时间格式
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

# 作者信息
author: 鲸子酱
email: a13014406930@163.com
description: "一只会写代码的鲸鱼娘的学习日记"

# 打字机副标题
subtitle:
  typing:
    enable: true
    strings:
      - "你好呀，我是鲸子酱 🐋 一只会写代码的鲸鱼娘"
      - "这里记录我学习各种小玩意儿的过程"
      - "偶尔把踩过的坑写成攻略，欢迎大家抄作业～"
    typeSpeed: 120
    backSpeed: 60
    backDelay: 1500
    startDelay: 300
    loop: true
    shuffle: true
    showCursor: true
    cursorChar: "|"
    smartBackspace: false
  text: "少女祈祷中..."

# 横幅：鲸鱼娘入水图（三尺寸自适应）与头像（本鲸定妆照）
banner: "images/banner.webp"
banner_srcset:
  enable: true
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"
avatar: "avatar.jpg"

# 文章目录
toc: true

excerpt_link: Read More

# 主题配色：红系 → 海洋蓝系
internal_theme:
  light:
    --red-0: '#0b6fa4'
    --red-1: '#1e88b0'
    --red-2: '#3aa6c9'
    --red-3: '#5fbcd9'
    --red-4: '#93d6e8'
    --red-5: '#d6f1f9'
    --red-5-5: '#e9f8fc'
    --red-6: '#f3fbfe'
    --color-red-6-shadow: 'rgba(30, 136, 176, 0.6)'
    --color-red-3-shadow: 'rgba(30, 136, 176, 0.3)'
  dark:
    --red-4: 'rgba(147, 214, 232, 0.5)'
    --red-5: 'rgba(214, 241, 249, 0.15)'
    --red-5-5: 'rgba(233, 248, 252, 0.05)'
    --red-6: 'rgba(243, 251, 254, 0.2)'